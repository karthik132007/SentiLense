[project]
name = "sentilense-model"
version = "0.1.0"
description = "Reproducible calibrated sentiment SVMs and backend inference assets"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn==1.9.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "joblib==1.5.3",
    "ftfy==6.3.1",
    "torch==2.14.1+cpu",
    "transformers==5.19.0",
    "safetensors==0.8.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "trafilatura>=1.8,<3",
    "pydantic>=2.6,<3",
    "lxml>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentiment_model*"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
